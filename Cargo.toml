[workspace]
resolver = "3"
members = ["crates/suite-common", "engines/document-engine", "engines/spreadsheet-engine", "engines/presentation-engine", "apps/document-editor", "apps/spreadsheet", "apps/presentation"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/Likounsee/Likounsee-Office-Suite"

[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
